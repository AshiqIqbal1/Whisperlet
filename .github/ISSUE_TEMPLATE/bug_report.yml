name: Bug report
description: Report a problem with Whisperlet
labels: ["Bug"]
body:
  - type: textarea
    id: repro-steps
    attributes:
      label: Steps to reproduce
      description: What did you do?
      placeholder: |
        1. Open Whisperlet
        2. Click ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and version
      placeholder: e.g. macOS 15.1, Windows 11
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Whisperlet version
      placeholder: e.g. v0.4.2 (see Settings > About)
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Logs, screenshots, anything else useful
    validations:
      required: false
