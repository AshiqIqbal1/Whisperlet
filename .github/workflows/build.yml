name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# 6.9+ required on macOS: Qt <=6.8 links the AGL framework, which Apple
# removed from the SDK shipped on current macos-latest runners.
# Least privilege by default: only the release job re-enables write access.
permissions:
  contents: read

env:
  QT_VERSION: '6.9.*'

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: 'qtmultimedia'
          cache: true

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j3

      - name: Package (dmg)
        run: |
          macdeployqt build/Whisperlet.app
          # Re-sign AFTER macdeployqt: it rewrites the bundled Qt libraries,
          # which invalidates the signature CMake applied. Without a valid
          # signature macOS forgets Accessibility/Microphone grants on every
          # launch.
          codesign --force --deep --sign - --timestamp=none build/Whisperlet.app
          codesign --verify --deep --strict build/Whisperlet.app
          hdiutil create -volname Whisperlet -srcfolder build/Whisperlet.app \
            -ov -format UDZO Whisperlet-macos-arm64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Whisperlet-macos-arm64
          path: Whisperlet-macos-arm64.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: 'qtmultimedia'
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      # GPU acceleration for the shipped Windows build. The SDK is only
      # needed to compile the shaders; users need nothing beyond the normal
      # graphics driver, and the build falls back to CPU where there is no
      # Vulkan device.
      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: false
          cache: true

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j3

      - name: Package (zip)
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build/Whisperlet.exe dist/
          windeployqt --release --no-translations dist/Whisperlet.exe
          Compress-Archive -Path dist/* -DestinationPath Whisperlet-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Whisperlet-windows-x64
          path: Whisperlet-windows-x64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Checksums
        run: sha256sum Whisperlet-macos-arm64.dmg Whisperlet-windows-x64.zip > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Whisperlet-macos-arm64.dmg
            Whisperlet-windows-x64.zip
            SHA256SUMS.txt
          generate_release_notes: true
