name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  # Reused by release.yml (the Monday scheduled release) via `workflow_call`
  # so the build steps aren't duplicated. `tag`/`prerelease` are only
  # meaningful for that call; a direct tag push ignores them.
  workflow_call:
    inputs:
      tag:
        description: 'Tag to attach the release to (workflow_call only)'
        type: string
        required: false
      prerelease:
        description: 'Mark the created release as a pre-release (workflow_call only)'
        type: boolean
        required: false
        default: true

# 6.9+ required on macOS: Qt <=6.8 links the AGL framework, which Apple
# removed from the SDK shipped on current macos-latest runners.
# Least privilege by default: only the release job re-enables write access.
permissions:
  contents: read

env:
  QT_VERSION: '6.9.*'

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      # cppcheck needs no compile database and no Qt install: --library=qt
      # teaches it Qt's macros/ownership semantics well enough to check
      # every src/ file, including the Windows-only ones, from any host.
      # _deps (vendored whisper.cpp) is out of scope per issue #1 and is
      # never passed in below.
      #
      # .cppcheck-suppressions must stay comment-free: apt's cppcheck on
      # ubuntu-latest (2.13.0) predates '#' comment support in
      # --suppressions-list and fails with "Failed to add suppression. No
      # id." if the file has any. Keep suppression rationale here instead:
      # useStlAlgorithm is a style-only suggestion to replace raw loops
      # with std::accumulate/std::transform/std::find_if; the affected
      # loops are on hot audio-processing paths (AudioUtil, AudioRecorder,
      # WhisperEngine) or tiny catalog lookups, so converting them buys no
      # correctness or measurable performance benefit.
      - name: cppcheck (src/ only)
        run: |
          cppcheck --enable=warning,performance,portability,style \
            --std=c++17 --language=c++ \
            --library=qt \
            --suppress=missingIncludeSystem \
            --suppressions-list=.cppcheck-suppressions \
            --error-exitcode=1 \
            -I src \
            -j "$(nproc)" \
            src/

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: 'qtmultimedia'
          cache: true

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j3

      - name: Package (dmg)
        run: |
          macdeployqt build/Whisperlet.app
          # Re-sign AFTER macdeployqt: it rewrites the bundled Qt libraries,
          # which invalidates the signature CMake applied. Without a valid
          # signature macOS forgets Accessibility/Microphone grants on every
          # launch.
          codesign --force --deep --sign - --timestamp=none build/Whisperlet.app
          codesign --verify --deep --strict build/Whisperlet.app
          hdiutil create -volname Whisperlet -srcfolder build/Whisperlet.app \
            -ov -format UDZO Whisperlet-macos-arm64.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Whisperlet-macos-arm64
          path: Whisperlet-macos-arm64.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: 'qtmultimedia'
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      # GPU acceleration for the shipped Windows build. The SDK is only
      # needed to compile the shaders; users need nothing beyond the normal
      # graphics driver, and the build falls back to CPU where there is no
      # Vulkan device.
      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: false
          cache: true

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j3

      - name: Package (zip)
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build/Whisperlet.exe dist/
          windeployqt --release --no-translations dist/Whisperlet.exe
          Compress-Archive -Path dist/* -DestinationPath Whisperlet-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Whisperlet-windows-x64
          path: Whisperlet-windows-x64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_call'
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Checksums
        run: sha256sum Whisperlet-macos-arm64.dmg Whisperlet-windows-x64.zip > SHA256SUMS.txt

      # Only the Monday scheduled run (release.yml, via workflow_call with
      # prerelease: false) produces a full/latest release. Every other
      # trigger of this job - a manual `git tag vX && git push --tags`, or
      # any future workflow_call that doesn't override the default - is
      # marked prerelease so it never displaces the weekly release as
      # "Latest".
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            Whisperlet-macos-arm64.dmg
            Whisperlet-windows-x64.zip
            SHA256SUMS.txt
          generate_release_notes: true
          prerelease: ${{ github.event_name != 'workflow_call' || inputs.prerelease }}
